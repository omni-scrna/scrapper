[workspace]
authors = ["Atreya Choudhury"]
channels = ["conda-forge", "bioconda", "https://prefix.dev/almost-conductor"]
name = "scrapper"
platforms = ["linux-64", "osx-arm64"]
version = "0.1.0"

[tasks]
export-env = "pixi workspace export conda-environment --name $(basename $(git rev-parse --show-toplevel)) envs/scrapper.yml && sed -i '1s/^/# this file was auto-generated by pixi - do not edit by hand\\n/' envs/scrapper.yml"

[dependencies]
r-base = ">=4.5"
bioconductor-scrapper = "*"
bioconductor-biocsingular = "*"
bioconductor-rhdf5 = "*"
bioconductor-delayedarray = "*"
bioconductor-hdf5array = "*"
bioconductor-singlecellexperiment = "*"
bioconductor-anndatar = "*"
r-matrix = "*"
r-yaml = "*"
r-argparser = "*"
r-jsonlite = "*"
"r-data.table" = "*"

# env for quick dev tasks - avoid the regular deps
[feature.dev.dependencies]
python = ">=3.11"
pyyaml = ">=6"
curl = "*"

[feature.dev.tasks]
sync = "sh -c 'curl -fsSL https://raw.githubusercontent.com/omni-scrna/boilerplate/${BRANCH:-main}/scripts/pull.py | python -'"

[environments]
dev = { features = ["dev"], no-default-feature = true }
